<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidrobox</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #000; color: #FFD700; }
        .header, .footer { text-align: center; padding: 20px; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; }
        .gallery img { width: 30%; margin: 5px; transition: transform 0.2s; }
        .gallery img:hover { transform: scale(1.05); }
        /* Add more CSS styles */
    </style>
</head>
<body>

    <header class="header">
        <h1>Welcome to Vidrobox</h1>
        <nav>
            <ul>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#testimonials">Testimonials</a></li>
                <li><a href="#map">Find Us</a></li>
            </ul>
        </nav>
    </header>

    <section id="gallery" class="gallery">
        <h2>Photo Gallery</h2>
        <!-- Images will go here -->
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </section>

    <section id="testimonials">
        <h2>Testimonials</h2>
        <p>"Best service ever!" - Customer Name</p>
        <!-- Add more testimonials -->
    </section>

    <section id="map">
        <h2>Our Location</h2>
        <div id="map-container">
            <!-- Embedded Map -->
        </div>
    </section>

    <footer class="footer">
        <p>Connect with us on <a href="https://www.instagram.com/yourprofile" target="_blank">Instagram</a></p>
        <a href="whatsapp://send?text=Hello" class="whatsapp-button">WhatsApp Us</a>
    </footer>

</body>
</html>
